# yaml-language-server: $schema=https://www.coderabbit.ai/integrations/schema.v2.json
language: ru-RU

early_access: false

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary_instructions: >-
    Суммируй изменения по фактическим областям репозитория: инструменты CrowdAnki,
    Rust tooling, тесты и репозиторные контракты/документация. Объясняй, что
    изменено, зачем и какой наблюдаемый эффект это имеет. Если задача или Scope
    явно заданы в PR, issue или локальном контексте, сверяй diff именно с ними.
    Не придумывай отсутствующий Scope и не представляй предположение как факт.
    Отдельно отмечай случайные массовые изменения JSON, изменение идентичности
    сущностей Anki/CrowdAnki и изменения публичного контракта tools/anki-repo.
    Пользовательские колоды, ресурсы и приватный журнал операций через Git не
    публикуются, поэтому в diff PR их быть не должно.
  high_level_summary_in_walkthrough: true
  review_details: true
  fail_commit_status: false
  suggested_labels: false
  suggested_reviewers: false
  in_progress_fortune: false
  enable_prompt_for_ai_agents: true

  path_instructions:
    - path: "**/*"
      instructions: >-
        Сначала сверяй AGENTS.md и применимые документы из .codex/context с
        фактическим diff. Эти зафиксированные в репозитории контракты имеют
        приоритет над общими рекомендациями. Сообщай применимые ошибки
        корректности, целостности данных, сопровождаемости, детерминизма,
        регрессии и покрытия тестами вне зависимости от серьёзности, если
        замечание конкретно и требует действия. Не предлагай несвязанные
        улучшения или архитектурную переделку только ради
        вкуса. Перед рекомендацией проверь фактические места вызова, тесты,
        форматы данных и существующий контракт. При недостатке подтверждающих данных явно
        укажи неопределённость вместо выдуманного дефекта.

    - path: "tools/anki-repo/src/**/*.rs"
      instructions: >-
        Сохраняй основной контракт anki-repo: каждая команда работает с одним
        CrowdAnki-экспортом за вызов; edit и retire меняют только deck.json,
        create размещает media лишь по явным правилам домена, а migrate-media —
        лишь после доказательства пары AssetIdentity и точного имени legacy-файла и
        инвентаризации всех потребителей в полях, qfmt, afmt и CSS. Миграция
        может материализовать канонический файл и удалить legacy-файл после
        публикации deck.json; любое другое изменение media считай регрессией.
        Читающих команд девять (inspect/find/stats/validate/qa/review/
        review-check/models/visual-report), содержимое экспорта меняют четыре, и каждая пишет
        только по явному --apply: edit меняет значения существующих полей,
        create добавляет заметку в существующую колоду существующей модели,
        retire дописывает тег вывода из обращения, migrate-media переписывает
        только доказанные ссылки существующей заметки. Физического удаления
        заметок, создания колод и моделей и изменения идентификаторов в toolkit
        нет — появление такой ветки считай регрессией контракта, а не
        расширением. visual-report пишет только новый каталог отчёта, никогда не
        внутрь экспорта или decks/**, и остаётся офлайновым: ни сети, ни
        <script>, ни подмены внешних ссылок. Проверяй детерминированность,
        стабильность JSON-контракта, schema_version, command/error codes,
        exit codes, порядок вывода, семантику всех команд и разделение
        stdout/stderr. Отдельно следи за границей QA-review: toolkit
        не вызывает LLM API и не ходит в сеть, реестр правил QA детерминирован,
        результаты QA не делают экспорт невалидным и не блокируют edit, а
        review-check ничего не пишет и выпускает edit_request только для
        полностью валидного документа. Новое правило QA обязано попадать в общий
        реестр, а не в отдельную ветку диспетчера. Учитывай Rust edition 2024 и
        запрет unsafe_code. Новые panic paths, недетерминированные HashMap/FS
        последствия итераций, неограниченный вывод, чтение media по небезопасным
        путям и скрытые filesystem mutations считай существенными дефектами.
        Изменение наблюдаемого CLI-контракта должно сопровождаться
        соответствующими тестами и обновлением README.

        migrate-layout — отдельная операция изменения раскладки, а не пятая
        команда правки содержимого экспорта: только с явным --apply она может
        переместить целый каталог экспорта из прежней структуры в
        decks/output/, включая media/ без изменения байтов и идентичностей.
        Требуй проверки полного отпечатка до и после, отказа при symlink и
        атомарной публикации без замены занятого назначения. Не запрещай ей
        перенос media/ как часть целого экспорта; запрещено менять содержимое
        или перемещать сущности внутри экспорта.

    - path: "tools/anki-repo/tests/**/*.rs"
      instructions: >-
        Проверяй, что тесты защищают публичный контракт, а не только текущую
        реализацию. Synthetic tests должны покрывать доменные ошибки и ветви
        проверки; тесты CLI — аргументы, exit codes и stdout/stderr; тесты на
        синтетических экспортах — пересчитывать ожидаемые значения из
        собственного fixture там, где это является контрактом, а не закреплять
        хрупкие случайные числа. Тесты по умолчанию не читают decks/** и не
        используют пользовательские колоды как тестовые данные. Не допускай
        ослабления assertions ради прохождения тестов. Тесты должны оставаться
        детерминированными.

    - path: "tools/anki-repo/Cargo.toml"
      instructions: >-
        Проверяй необходимость новых зависимостей и features, совместимость с
        Rust edition 2024, заявленной MSRV из `[workspace.package]`
        корневого `Cargo.toml` и актуальным stable toolchain,
        сохранение publish=false и unsafe_code=forbid. Новая зависимость должна
        решать конкретную задачу и не дублировать уже имеющуюся возможность.

    - path: "Cargo.lock"
      instructions: >-
        Cargo.lock лежит в корне: workspace собирается и тестируется из корня
        репозитория, участник — tools/anki-repo. Меняться он должен только как
        следствие осознанного изменения зависимостей или воспроизводимого
        обновления lockfile. Флагай необъяснимый lockfile churn, рассинхронизацию
        с Cargo.toml и копию lockfile внутри каталога crate'а.

    - path: ".codex/context/**"
      instructions: >-
        Контекст должен описывать долговременные репозиторные контракты и
        фактическое текущее устройство проекта. Не закрепляй в нём временный
        номер PR, commit SHA, разовый план, transient review result или факт,
        который уже расходится с кодом/JSON. Изменения структуры CrowdAnki и
        verification workflow должны оставаться согласованными с AGENTS.md и
        tools/anki-repo/README.md.

    - path: "AGENTS.md"
      instructions: >-
        Проверяй инструкции как обязательный контракт репозитория. Новое правило
        не должно противоречить фактической структуре репозитория, CrowdAnki
        данным или tools/anki-repo. Не превращай временную задачу, ветку, PR или
        локальный workaround в постоянный глобальный контракт.

    - path: "**/README.md"
      instructions: >-
        Документация должна совпадать с реально существующими командами,
        аргументами, путями, exit codes, ограничениями и read-only поведением.
        Флагай устаревшие примеры и обещания функциональности, которой код не
        предоставляет.

  tools:
    clippy:
      enabled: true

  auto_review:
    enabled: false
    auto_incremental_review: false
    auto_pause_after_reviewed_commits: 0

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false

  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      mode: "off"
    description:
      mode: "off"
    issue_assessment:
      mode: "off"

chat:
  art: false
  auto_reply: false

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - files: AGENTS.md
        applyTo: "**/*"
      - files: .codex/context/01-PROJECT-MAP.md
        applyTo: "**/*"
      - files: .codex/context/02-CROWDANKI-JSON.md
        applyTo: "tools/anki-repo/**/*"
      - files: .codex/context/03-VERIFICATION.md
        applyTo: "tools/anki-repo/**/*"
      - files: tools/anki-repo/README.md
        applyTo: "tools/anki-repo/**/*"
  learnings:
    scope: local
    approval_delay: 30
  issues:
    scope: local
  jira:
    usage: disabled
  linear:
    usage: disabled
  pull_requests:
    scope: local
  mcp:
    usage: disabled

issue_enrichment:
  planning:
    enabled: false
    auto_planning:
      enabled: false
