name: Проверки репозитория

# Семантические события запуска без привязки к имени ветки:
# - `pull_request` — проверка любого PR;
# - `push` — событие покрывает интеграцию в поддерживаемую ветку, а какой именно
#   ветка является основной, задание определяет через `github.event.repository`
#   (см. `if` у заданий), поэтому имя ветки в процессе не зашито;
# - `workflow_dispatch` — ручной запуск.
on:
  pull_request:
  push:
  workflow_dispatch:

# CI только читает репозиторий: ни одно задание не пишет в него, не публикует
# артефакты и не выполняет изменяющих операций с репозиторием.
permissions:
  contents: read

concurrency:
  # Новый прогон отменяет предыдущий только для PR: проверку основной ветки
  # нельзя отменять на середине.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Предупреждения компиляции делают сборку и тесты красными, как и Clippy.
  CARGO_BUILD_WARNINGS: deny

jobs:
  lint:
    name: Форматирование и Clippy
    # Отправка изменений в рабочую ветку не дублирует прогон PR: на `push` задание выполняется
    # только для основной ветки текущего репозитория.
    if: >-
      github.event_name != 'push'
      || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Получить исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Проверить контракты скриптов и метаданные Agent Skills
        # Единственный владелец этих проверок: они не зависят от данных репозитория
        # и нужны также при отправке изменений в основную ветку, где события PR нет.
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
          python3 .github/scripts/check_skill_contracts.py
          python3 .github/scripts/check_documentation_i18n.py

      - name: Установить Rust из rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show active-toolchain
          rustc --version --verbose
          cargo --version

      - name: Проверить контракт MSRV, rustup и компилятора
        run: python3 .github/scripts/check_rust_toolchain.py

      - name: Восстановить кэш Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Проверить форматирование
        run: cargo fmt --all --check

      - name: Проверить статику Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  code:
    name: Код и тесты
    env:
      # sccache сохраняет результаты rustc библиотечных пакетов рабочей области между
      # исполнителями GitHub Actions; rust-cache ниже кэширует реестр и сборку Cargo.
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    # Отправка изменений в рабочую ветку не дублирует прогон PR: при `push` задание выполняется
    # только для основной ветки текущего репозитория.
    if: >-
      github.event_name != 'push'
      || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Получить исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Установить Rust из rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show active-toolchain
          rustc --version --verbose
          cargo --version

      - name: Проверить контракт MSRV, rustup и компилятора
        run: python3 .github/scripts/check_rust_toolchain.py

      - name: Настроить sccache
        uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0

      - name: Восстановить кэш Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Всё задание использует один специализированный профиль (тесты и `cargo run`),
          # поэтому используем отдельное поколение кэша зависимостей.
          key: unified-ci-v1

      - name: Собрать и выполнить тесты
        # В рабочей области нет тестов, ограниченных возможностями Cargo. Единственная возможность
        # `reference-generator` включает resvg только для двух служебных
        # исполняемых файлов генератора; сборку всех целей и возможностей уже проверяют
        # задания Clippy и MSRV параллельно.
        run: cargo test --workspace --locked --profile ci

      - name: Проверить, что пользовательские данные не отслеживаются Git
        # Постоянная граница: колоды и локальное доверенное хранилище ресурсов
        # живут только в игнорируемых областях `decks/` (целиком) и
        # `.asset-store/`. Одного `.gitignore` мало — он не отменяет уже
        # добавленный индекс и обходится `git add -f`, поэтому проверка идёт по
        # фактическому индексу и дополнительно подтверждает, что правила
        # игнорирования на месте и не ослаблены повторным включением.
        #
        # Проверок содержимого пользовательских областей здесь нет намеренно: в
        # чистом clone этих областей не существует, и шаг, который «проверил» бы
        # их отсутствие, выдал бы пустоту за проверку личных колод. Локальные
        # проверки своего хранилища (`kanji-corpus-gate`, `pitch-corpus-gate`) и
        # своих экспортов (`anki-repo validate`) описаны в
        # `tools/asset-store/README.md` и `tools/anki-repo/README.md`.
        run: python3 .github/scripts/check_local_data_untracked.py

      - name: Показать статистику sccache
        if: always()
        run: sccache --show-stats

  msrv:
    name: Заявленная MSRV
    if: >-
      github.event_name != 'push'
      || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Получить исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Установить Rust из rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show active-toolchain
          rustc --version --verbose
          cargo --version

      - name: Проверить контракт MSRV, rustup и компилятора
        run: python3 .github/scripts/check_rust_toolchain.py

      - name: Восстановить кэш Rust для MSRV
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: msrv

      - name: Проверить сборку на заявленной MSRV
        run: cargo check --workspace --all-targets --all-features --locked
