name: CodeQL

# Advanced setup запускает анализ только когда меняется код или конфигурация,
# способная повлиять на Rust/GitHub Actions. Пользовательские колоды, ресурсы и
# приватный журнал операций не отслеживаются Git, поэтому их изменения в diff PR
# попасть не могут и многоминутный security scan не запускают.
on:
  pull_request:
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'rust-toolchain'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - '.github/workflows/**'
      - '.github/codeql/**'
      - '.github/codeql-config.yml'
  push:
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'rust-toolchain'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - '.github/workflows/**'
      - '.github/codeql/**'
      - '.github/codeql-config.yml'
  schedule:
    # Независимый полный security scan раз в неделю, даже если код не менялся.
    - cron: '17 2 * * 1'
  workflow_dispatch:

# Новый commit в PR делает предыдущий CodeQL-анализ устаревшим. Default setup
# не отменял такие прогоны, из-за чего несколько шестиминутных Rust-анализов
# могли выполняться одновременно.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read
  packages: read
  security-events: write

jobs:
  analyze:
    name: Анализ (${{ matrix.language }})
    # Push feature-ветки не дублирует pull_request scan. На push анализируем
    # только фактическую default branch, не зашивая её имя в workflow.
    if: >-
      github.event_name != 'push'
      || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - rust

    steps:
      - name: Получить исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Инициализировать CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          # Rust поддерживает анализ без полного cargo build. Для Actions это
          # также естественный режим; default query suite используется
          # автоматически, без security-extended. Отдельный dependency cache
          # здесь не включаем: он не ускоряет Rust CodeQL none-mode.
          build-mode: none

      - name: Выполнить CodeQL-анализ
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: '/language:${{ matrix.language }}'
