[package]
name = "anki-repo"
version = "0.1.0"
# `edition` и MSRV наследуются из корневого `[workspace.package]`.
# `rust-toolchain.toml` отражает MSRV для rustup; CI проверяет их совпадение.
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "CLI для детерминированного анализа CrowdAnki-экспортов репозитория Anki-decks и точечной правки значений их полей"
publish = false
autotests = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
getrandom = { version = "0.4", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
asset-store = { path = "../asset-store" }
repository-maintenance = { path = "../repository-maintenance" }
serde_yaml = { package = "yaml_serde", version = "0.10" }
rustix = { version = "1.1", features = ["fs"] }
unicode-normalization = "0.1"


[lib]
name = "anki_repo"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "anki-repo"
test = false
path = "src/main.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
