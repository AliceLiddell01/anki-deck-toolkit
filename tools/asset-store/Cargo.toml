[package]
name = "asset-store"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Переиспользуемое хранилище ресурсов с управлением жизненным циклом"
publish = false
autotests = false

[dependencies]
base64 = { version = "0.23", default-features = false, features = ["std"] }
clap = { version = "4.5", features = ["derive"] }
chromiumoxide = "0.9.1"
futures = "0.3"
flate2 = "1.1"
image = { version = "0.25.10", default-features = false, features = ["gif", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11"
rustix = { version = "1.1", features = ["fs", "process"] }
thiserror = "2"
toml = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "signal", "process", "io-util"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "fmt", "json"] }
unicode-normalization = "0.1.24"
url = { version = "2", features = ["serde"] }
reqwest = { version = "0.13.5", default-features = false }
resvg = { version = "0.48.1", default-features = false, features = ["text"], optional = true }
skrifa = { version = "0.49", default-features = false, features = ["std"], optional = true }
zip = { version = "9.0.0", default-features = false }

[features]
reference-generator = ["dep:resvg", "dep:skrifa"]
session-rotation-acceptance = []

[dev-dependencies]
gif = "=0.14.2"

[lib]
name = "asset_store"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "kanji-assets"
test = false
path = "src/main.rs"

[[bin]]
name = "kanji-corpus-gate"
test = false
path = "src/bin/kanji_corpus_gate.rs"

[[bin]]
name = "pitch-corpus-gate"
test = false
path = "src/bin/pitch_corpus_gate.rs"

[[bin]]
name = "pitch-assets"
test = false
path = "src/bin/pitch_assets.rs"

[[bin]]
name = "build-kanjivg-reference"
path = "src/bin/build_kanjivg_reference.rs"
required-features = ["reference-generator"]

[[bin]]
name = "build-noto-font-reference"
path = "src/bin/build_noto_font_reference.rs"
required-features = ["reference-generator"]

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
